[build]
  publish = "."

# Cache static assets for 1 year
[[headers]]
  for = "/*.min.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — revalidate every hour at CDN, no browser cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/articles/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/guides/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/weekly/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

# Sitemap — טרי
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://ep2.adtrafficquality.google https://tpc.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; font-src 'self' https://fonts.gstatic.com"

# Hub pages clean URLs
[[redirects]]
  from = "/comparisons"
  to = "/comparisons.html"
  status = 200

[[redirects]]
  from = "/השוואות"
  to = "/comparisons.html"
  status = 301

# URL canonicalization — strip .html (301)
[[redirects]]
  from = "/articles/*.html"
  to = "/articles/:splat"
  status = 301

[[redirects]]
  from = "/guides/*.html"
  to = "/guides/:splat"
  status = 301

# Redirects — legacy article URLs
[[redirects]]
  from = "/article_claude_vs_gpt4o.html"
