[build]
  publish = "."

# Cache static assets for 1 year
[[headers]]
  for = "/*.min.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — no cache (תוכן משתנה)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/articles/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Sitemap — טרי
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects — legacy article URLs
[[redirects]]
  from = "/article_claude_vs_gpt4o.html"
  to = "/articles/claude-vs-gpt4o.html"
  status = 301

[[redirects]]
  from = "/article2_ai_video_tools.html"
  to = "/articles/ai-video-tools.html"
  status = 301

[[redirects]]
  from = "/article3_vibe_coding.html"
  to = "/articles/vibe-coding.html"
  status = 301
