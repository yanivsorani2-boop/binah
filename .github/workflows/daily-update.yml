name: Daily Content Update

on:
  schedule:
    # 05:00 UTC = 08:00 Israel summer (UTC+3)
    - cron: '0 5 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Verify API key exists
        run: |
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "❌ CLAUDE_API_KEY is not set in GitHub Secrets!"
            exit 1
          fi
          echo "✅ API key found"
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Generate daily content
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/generate_daily.py

      - name: Commit and push new content
        run: |
          git config --global user.name  "binah-bot"
          git config --global user.email "bot@binah.co.il"
          git add -A
          git diff --staged --quiet && echo "⏭ אין שינויים לדחוף" || (git commit -m "🤖 עדכון יומי — $(date +'%Y-%m-%d')" && git push)

      - name: Summary
        if: always()
        run: |
          echo "### תוצאת עדכון יומי 🤖" >> $GITHUB_STEP_SUMMARY
          echo "תאריך: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
